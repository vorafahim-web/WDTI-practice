<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .container
        {
            display: flex;
            flex-wrap: wrap;
            width: 1000px;
            height: 500px;
            border: 2px solid rgb(199,68,68);
            gap: 20px;
        }
        .box
        {
            width: 100px;
            height: 80px;
            margin: 5px;
            background-color: rgb(47, 140,171);
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
        }
        .box3
        {
            order: 2;
        }
        .box2
        {
            order: 3;
            flex-grow: 1;
        }
        .box1
        {
            flex-basis: 280px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <h2>flexbox : Wrap,Grow & Order</h2>
    
    <div class="container">

        <div clas="box box1">Box 1</div>
        <div clas="box box2">Box 2</div>
        <div clas="box box3">Box 3</div>
        <div clas="box ">Box 4</div>
        <div clas="box">Box 5</div>
        <div clas="box ">Box 6</div>
    </div>
</body>
</html>
